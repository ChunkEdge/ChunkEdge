name: CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  chunkedge-fmt:
    name: Rust Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-ci
        with:
          profile: rust

      - name: Rust Formatting
        run: nix develop .#rust --command check-fmt-rust

  chunkedge-docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-ci
        with:
          profile: rust
          rust-cache: "true"

      - name: Documentation
        run: nix develop .#rust --command check-rust-docs

  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-ci
        with:
          profile: tooling

      - name: Typos
        run: nix develop .#tooling --command check-typos

  chunkedge-clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-ci
        with:
          profile: rust
          rust-cache: "true"

      - name: Clippy
        run: nix develop .#rust --command lint-rust-clippy

  chunkedge-tests:
    strategy:
      fail-fast: true
      matrix:
        platform: [macos-latest, ubuntu-latest]
    name: Tests (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-ci
        with:
          profile: rust
          rust-cache: "true"

      - name: Run tests
        run: nix develop .#rust --command test-rust-basic

      - name: Run doctests
        run: nix develop .#rust --command test-rust-docs

      - name: Run chunkedge_nbt tests without preserve_order feature
        run: nix develop .#rust --command test-rust-nbt

  chunkedge-tests-windows:
    name: Tests (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Nix cannot run natively on Windows.
      # We share its version through the rust-toolchain file.
      - name: Read Rust version
        id: rust-version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw rust-toolchain).Trim()
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup Rust toolchain and cache
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}

      - name: Copy playground
        run: cp tools/playground/src/playground.template.rs tools/playground/src/playground.rs

      - name: Run tests
        run: cargo test --workspace --all-features --all-targets

      - name: Run doctests
        run: cargo test --workspace --all-features --doc

      - name: Run chunkedge_nbt tests without preserve_order feature
        run: cargo test -p chunkedge_nbt --all-targets

  chunkedge-miri:
    name: Miri Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-ci
        with:
          profile: miri
          rust-cache: "true"

      - name: Miri Tests
        run: nix develop .#miri --command test-rust-miri

  extractor-fmt:
    name: Java Formatting (Extractor)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-ci
        with:
          profile: java
          gradle-cache: "true"

      - name: Java Formatting (Extractor)
        run: nix develop .#java --command check-fmt-java --build-cache

  extractor-lint:
    name: Java Lint (Extractor)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-ci
        with:
          profile: java
          gradle-cache: "true"

      - name: Java Lint (Extractor)
        run: nix develop .#java --command lint-java-all --build-cache

  extractor-build:
    name: Build Extractor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-ci
        with:
          profile: java
          gradle-cache: "true"

      - name: Build Extractor
        run: nix develop .#java --command build-java --build-cache

  check-depgraph:
    name: Dependency Graph (assets/depgraph.svg)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-ci
        with:
          profile: tooling

      - name: Generate new depgraph
        run: nix develop .#tooling --command generate-depgraph

      - name: Check depgraph diff
        run: git diff --exit-code assets/depgraph.svg > assets/depgraph.patch

      - name: Create comment artifact
        if: ${{ failure() && github.event_name == 'pull_request' }}
        run: |
          mkdir ./bad-depgraph
          echo ${{ github.event.number }} >> ./bad-depgraph/event-number

          echo "It looks like this pull request changed the workspace structure. \
          Please replace \`assets/depgraph.svg\` with the following text:

          <details>
            <summary>depgraph.svg (Don't forget the trailing newline)</summary>

          \`\`\`html
          $(cat assets/depgraph.svg)

          \`\`\`
          </details>

          For reference, here is a diff against the old \`depgraph.svg\`:

          <details>

          \`\`\`patch
          $(cat assets/depgraph.patch)
          \`\`\`
          </details>" > ./bad-depgraph/pr-comment.txt

      - name: Upload comment artifact
        uses: actions/upload-artifact@v7
        if: ${{ failure() && github.event_name == 'pull_request' }}
        with:
          name: bad-depgraph
          path: bad-depgraph/
          # ci-pr-comments.yml downloads and extracts this as a ZIP archive.
          archive: true

  udeps:
    name: Unused Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-ci
        with:
          profile: tooling
          rust-cache: "true"

      - name: Unused Dependencies
        run: nix develop .#tooling --command check-rust-unused-deps
