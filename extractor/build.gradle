plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'com.diffplug.spotless' version '8.10.4'
	id 'pmd'
	id 'net.ltgt.errorprone' version '5.2.0'
}

base {
	archivesName = project.archives_base_name
}
version = project.mod_version
group = project.maven_group

loom {
	splitEnvironmentSourceSets()

	mods {
		"chunkedge_extractor" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	implementation 'com.google.code.gson:gson:2.11.0'
	errorprone 'com.google.errorprone:error_prone_core:2.51.0'

	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	// Only the dedicated lint task enables Error Prone.
	it.options.errorprone.enabled = false
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}"}
	}
}

spotless {
	// Formatting is enforced by the dedicated CI job, independently of build/check.
	enforceCheck = false
	java {
		target 'src/**/*.java'
		googleJavaFormat('1.30.0').aosp()
	}
}

// Lint tasks are explicit so ordinary build/check tasks remain independent.
pmd {
	toolVersion = '7.24.0'
	sourceSets = []
	consoleOutput = true
	ruleSets = ['category/java/errorprone.xml', 'category/java/bestpractices.xml']
}

tasks.register('lintPmd', Pmd) {
	group = 'verification'
	description = 'Lint main and client Java sources with PMD.'
	source sourceSets.main.allJava, sourceSets.client.allJava
	classpath = sourceSets.main.compileClasspath + sourceSets.client.compileClasspath
	reports {
		xml.required = true
		html.required = true
	}
}

def lintAnnotationProcessor = configurations.resolvable('lintAnnotationProcessor') {
	extendsFrom configurations.errorprone
}

tasks.register('lintErrorProne', JavaCompile) {
	group = 'verification'
	description = 'Lint main and client Java sources with Error Prone.'
	source sourceSets.main.allJava, sourceSets.client.allJava
	classpath = sourceSets.main.compileClasspath + sourceSets.client.compileClasspath
	destinationDirectory = layout.buildDirectory.dir('lint/errorprone')
	options.annotationProcessorPath = lintAnnotationProcessor.get()
	options.errorprone.enabled = true
}
